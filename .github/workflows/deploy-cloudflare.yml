name: Deploy TradeStrategyReplay to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-strategy-replay-cloudflare-production
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT_NAME: trade-strategy-replay
  PRODUCTION_URL: https://trade-strategy-replay.pages.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Verify dedicated Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.TRADE_STRATEGY_REPLAY_CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.TRADE_STRATEGY_REPLAY_CF_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || (echo "Missing TRADE_STRATEGY_REPLAY_CF_API_TOKEN" && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "Missing TRADE_STRATEGY_REPLAY_CF_ACCOUNT_ID" && exit 1)

      - name: Ensure isolated Cloudflare Pages project exists
        env:
          CF_API_TOKEN: ${{ secrets.TRADE_STRATEGY_REPLAY_CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.TRADE_STRATEGY_REPLAY_CF_ACCOUNT_ID }}
        run: |
          STATUS=$(curl -sS -o /tmp/pages-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME")

          if [ "$STATUS" = "200" ]; then
            echo "Cloudflare Pages project '$CLOUDFLARE_PROJECT_NAME' already exists."
          elif [ "$STATUS" = "404" ]; then
            echo "Creating Cloudflare Pages project '$CLOUDFLARE_PROJECT_NAME'..."
            curl -fsS -X POST \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$CLOUDFLARE_PROJECT_NAME\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects"
          else
            cat /tmp/pages-project.json
            echo "Unable to check Cloudflare Pages project (HTTP $STATUS)."
            exit 1
          fi

      - name: Deploy isolated Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.TRADE_STRATEGY_REPLAY_CF_API_TOKEN }}
          accountId: ${{ secrets.TRADE_STRATEGY_REPLAY_CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=trade-strategy-replay --branch=main

      - name: Production smoke test
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$PRODUCTION_URL/" > /dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$PRODUCTION_URL/strategies/index.json" > /dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$PRODUCTION_URL/markets/index.json" > /dev/null
          echo "TradeStrategyReplay production smoke test passed: $PRODUCTION_URL"
